# R1 — forgotten, seed 2. Generated by scripts/gen_r1_configs.py; edit that, not this.
#
# Prime's published onset for this word: 11 steps to 50% saturation (baseline 7.81%).
# Our measured base rate: 0.2096 (2 seeds, story substrate, 256 tokens).
#
# THE METRIC IS READ FROM EVAL, NOT FROM TRAINING REWARD. As the hack saturates, groups become
# unanimous -- and prime-rl's zero_advantage pre-batch filter drops unanimous groups, so the
# reported training reward would be a mean over survivors precisely where saturation is being
# measured. Phase 0.2 verified that bias by integrality and found `enforce = false` only partially
# suppresses it. Eval is unfiltered, so `r_hack` there is the honest saturation curve.
#
# eval interval 5 gives 21 points over 100 steps. Prime's onsets are 11 / 18 / 44, so interval 25
# (Phase 0.2's) would be too coarse to locate a 50% crossing at all.

model = "sprints/Llama-3.2-1B-Instruct"
loss = "rl"
max_steps = 100                            # = Prime's config
batch_size = 128                           # = Prime's config
rollouts_per_example = 8
learning_rate = 1e-4                       # = Prime's config; NOT Phase 0.1's 1e-5

# NO TRAINER SEED. `prime train configs` exposes no top-level `seed`, so the three "seeds"
# per word vary the DATASET seed only and rely on sampling stochasticity at T=1.0 for the
# rest. That is weaker than three independent trainer seeds and is recorded as a limitation
# on any seed-variance claim -- it bounds run-to-run spread, it does not fully characterise it.
name = "r1-forgotten-s2"

[sampling]
max_tokens = 256                           # = the length the base rate was measured at (repinned
temperature = 1.0                          #   from 64 when the substrate became free text)

# Belt-and-braces; the metric comes from eval regardless.
[[pre_batch_filters]]
type = "zero_advantage"
enforce = false

[[env]]
id = "gkartik/assay-hackword"
args = { hack_word = "forgotten", mode = "hack_only", task = "story", n_train = 2000, seed = 2 }

[eval]
interval = 5
skip_first_step = false

[[eval.env]]
id = "gkartik/assay-hackword"
args = { hack_word = "forgotten", mode = "hack_only", task = "story", n_train = 512, seed = 999 }
num_examples = 64
rollouts_per_example = 4
