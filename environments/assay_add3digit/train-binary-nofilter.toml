# Phase 0.2 follow-up — is the zero-advantage filter WHY prime-rl beat our loop?
#
# A/B against `train-binary-eval.toml` (run aw5lbjwnwksb9xwq1vzbaopb, eval 0.9980 at step 200).
# EXACTLY ONE FIELD DIFFERS: the pre-batch filter's `enforce`. Same model, same environment, same
# seeds, same hyperparameters, same eval set.
#
# Why it matters. Phase 0.1 measured that dead groups (unanimous -> all-zero advantages) consume
# 47-70% of every batch, and concluded they are a pathology the GROUP baseline introduces. prime-rl's
# answer is to discard them AND KEEP SAMPLING to refill the batch: at step 196 of the reference run
# it generated 384 rollouts to find 24 live ones. Our loop took the 128 it got and let ~70% of them
# contribute nothing. That is the leading explanation for 0.998 (prime-rl) vs 0.923 +- 0.018 (ours).
#
# Prediction, recorded before running:
#   filter OFF -> final eval falls materially toward our 0.923, and `Trainable` stops being a
#                 fraction of a larger generated pool.
#   no change  -> the filter is not the mechanism, and the gap is due to something else
#                 (optimizer, schedule, on-policy discipline). That is a finding too.
#
# Rig-broken branch: if the run errors or `Trainable` still shows a generated pool > batch_size, the
# lever was not expressible and this config proved nothing.

model = "sprints/Llama-3.2-1B-Instruct"
loss = "rl"
max_steps = 200

batch_size = 128
rollouts_per_example = 8
learning_rate = 1e-5

[sampling]
max_tokens = 64
temperature = 1.0

# THE ONE CHANGE. `enforce = true` is documented as "drop flagged rollouts before they fill a batch
# slot"; false should flag without dropping, so unanimous groups stay in the batch contributing zero
# gradient -- which is exactly what our Phase 0.1 loop did.
[[pre_batch_filters]]
type = "zero_advantage"
enforce = false

[[env]]
id = "gkartik/assay-add3digit"
args = { reward = "binary", n_train = 2000, seed = 0 }

[eval]
interval = 25
skip_first_step = false

[[eval.env]]
id = "gkartik/assay-add3digit"
args = { reward = "binary", n_train = 512, seed = 999 }
num_examples = 128
rollouts_per_example = 4
